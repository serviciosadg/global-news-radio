<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global News Radio | Live Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #000000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .x-border { border-color: #2f3336; }
    #feed-viewport::-webkit-scrollbar { width: 6px; }
    #feed-viewport::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-black">

  <!-- Main X/Twitter Timeline Column -->
  <div class="w-full max-w-xl border-x x-border min-h-screen flex flex-col">

    <!-- Sticky Top Bar: Title + AI Radio Player -->
    <header class="sticky top-0 z-20 bg-black/85 backdrop-blur-md border-b x-border p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
          <h1 class="text-xl font-bold tracking-tight text-white">Global News Radio</h1>
          <span class="bg-sky-500/20 text-sky-400 text-xs font-bold px-2 py-0.5 rounded-full border border-sky-500/30">LIVE AI</span>
        </div>
        <button id="scroll-toggle" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border x-border px-3 py-1 rounded-full transition">
          ⏸ Pause Autoscroll
        </button>
      </div>

      <!-- Audio Player Box -->
      <div class="bg-zinc-900/90 border x-border rounded-2xl p-3 flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs text-zinc-400">
          <span>🎙️ <strong class="text-white">On Air:</strong> Hourly Unbiased World News Briefing</span>
          <span class="text-amber-400 font-medium">Sponsorships Open</span>
        </div>
        <audio id="radio-player" controls class="w-full h-9">
          <source id="audio-source" src="news_broadcast.mp3" type="audio/mpeg" />
          Your browser does not support the audio element.
        </audio>
      </div>

      <!-- Pinned Sponsorship / Advertise Invite Banner -->
      <div class="bg-gradient-to-r from-sky-950/50 via-zinc-900 to-amber-950/40 border border-amber-500/40 rounded-2xl p-3.5 flex items-center justify-between gap-3">
        <div class="space-y-0.5">
          <div class="flex items-center gap-1.5">
            <span class="text-[11px] font-bold uppercase tracking-wider bg-amber-500 text-black px-1.5 py-0.5 rounded">Promoted</span>
            <span class="text-sm font-bold text-white">Advertise on Global News Radio</span>
          </div>
          <p class="text-xs text-zinc-300">Get your brand read live by our AI radio host & featured on this banner.</p>
        </div>
        <a href="mailto:sponsors@example.com?subject=Radio%20Sponsorship%20Inquiry" class="shrink-0 bg-white hover:bg-zinc-200 text-black font-bold text-xs px-4 py-2 rounded-full transition">
          Sponsor Us
        </a>
      </div>
    </header>

    <!-- Autoscrolling Twitter-Style Feed -->
    <div id="feed-viewport" class="flex-1 overflow-y-auto max-h-[calc(100vh-230px)] divide-y x-border">
      <div id="feed-list" class="divide-y x-border">
        <p class="p-6 text-zinc-500 text-sm text-center">Loading live global feed...</p>
      </div>
    </div>

  </div>

  <script>
    const feedViewport = document.getElementById('feed-viewport');
    const feedList = document.getElementById('feed-list');
    const scrollToggle = document.getElementById('scroll-toggle');
    const audioSource = document.getElementById('audio-source');
    const radioPlayer = document.getElementById('radio-player');

    // Cache-bust audio so listeners always get the newest broadcast
    audioSource.src = `news_broadcast.mp3?t=${Date.now()}`;
    radioPlayer.load();

    let isScrolling = true;
    let isHovered = false;

    scrollToggle.addEventListener('click', () => {
      isScrolling = !isScrolling;
      scrollToggle.textContent = isScrolling ? '⏸ Pause Autoscroll' : '▶️ Resume Autoscroll';
    });

    feedViewport.addEventListener('mouseenter', () => isHovered = true);
    feedViewport.addEventListener('mouseleave', () => isHovered = false);
    feedViewport.addEventListener('touchstart', () => isHovered = true);
    feedViewport.addEventListener('touchend', () => setTimeout(() => isHovered = false, 3000));

    function autoScrollStep() {
      if (isScrolling && !isHovered) {
        feedViewport.scrollTop += 0.6;
        if (feedViewport.scrollTop + feedViewport.clientHeight >= feedViewport.scrollHeight - 2) {
          feedViewport.scrollTop = 0;
        }
      }
      requestAnimationFrame(autoScrollStep);
    }

    function renderTweets(articles) {
      if (!articles || articles.length === 0) return;

      const displayList = [...articles, ...articles];

      feedList.innerHTML = displayList.map((item) => {
        const initials = item.source.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        const handle = '@' + item.source.toLowerCase().replace(/[^a-z0-9]/g, '');
        const timeStr = item.published ? new Date(item.published).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Live';

        return `
          <article class="p-4 hover:bg-zinc-950/80 transition flex gap-3">
            <div class="w-10 h-10 rounded-full bg-sky-900/60 border border-sky-500/40 flex items-center justify-center font-bold text-sky-400 text-sm shrink-0">
              ${initials}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 text-sm flex-wrap">
                <span class="font-bold text-white truncate">${item.source}</span>
                <svg class="w-4 h-4 text-sky-400 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.818-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.437 2.25c-.415-.165-.866-.25-1.336-.25-2.11 0-3.818 1.79-3.818 4 0 .494.083.964.237 1.4-1.272.65-2.147 2.018-2.147 3.6 0 1.495.782 2.798 1.942 3.486-.02.17-.032.34-.032.514 0 2.21 1.708 4 3.818 4 .47 0 .92-.086 1.335-.25.62 1.334 1.926 2.25 3.437 2.25 1.512 0 2.818-.916 3.437-2.25.415.163.865.248 1.336.248 2.11 0 3.818-1.79 3.818-4 0-.174-.012-.344-.033-.513 1.158-.687 1.943-1.99 1.943-3.484zm-6.616-3.334l-4.334 6.5c-.145.217-.382.334-.625.334-.143 0-.288-.04-.416-.126l-.115-.094-2.415-2.415c-.293-.293-.293-.768 0-1.06s.768-.294 1.06 0l1.77 1.767 3.825-5.74c.23-.345.696-.436 1.04-.207.346.23.44.696.21 1.04z"/></svg>
                <span class="text-zinc-500 text-xs">${handle} · ${timeStr}</span>
              </div>
              <p class="text-[15px] text-zinc-100 mt-1 leading-normal">
                ${item.title}
              </p>
              <div class="mt-2 flex items-center justify-between">
                <span class="text-xs text-sky-400">#${(item.category || 'World').replace(/\s+/g, '')}</span>
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-xs text-zinc-400 hover:text-sky-400 border x-border px-2.5 py-1 rounded-full transition">
                  Read Full Story ↗
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    fetch(`latest_news.json?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        renderTweets(data);
        requestAnimationFrame(autoScrollStep);
      })
      .catch(() => {
        renderTweets([
          { source: "BBC World", category: "World", title: "Welcome to Global News Radio! Your live headlines are loading.", link: "#", published: new Date().toISOString() }
        ]);
        requestAnimationFrame(autoScrollStep);
      });
  </script>
</body>
</html>
