name: Fetch News and Generate Radio

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser edge-tts

      - name: Run fetch script
        run: python fetch_news.py

      - name: Run radio generator script
        run: python generate_radio.py

      - name: Commit and push updated news and audio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_news.json news_broadcast.mp3
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news feed and audio broadcast [skip ci]" && git push)
